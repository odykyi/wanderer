name: Flisk compose check

# Fails when .autogenerated/docker-compose.yml no longer matches services/**/service.json.
# Optional tooling, see docs/FLISK.md. docker-compose.yml stays the main way to run wanderer.
on:
  pull_request:
    paths:
      - "services/**/service.json"
      - ".flisk/project.json"
      - ".autogenerated/docker-compose.yml"
      - ".github/workflows/flisk-compose-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @flisk-sh/flisk-export@0.9.0 compose . --check
