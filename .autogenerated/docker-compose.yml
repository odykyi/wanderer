# GENERATED by `flisk export compose` from the service.json files. DO NOT EDIT.
# Change service.json and run `flisk export compose --force`; CI can run
# `flisk export compose --check` to fail when this file is out of date.
# Flisk is not needed to start it. Compose reads .env from this file's folder,
# so from the project root pass the project's .env:
#   docker compose --env-file .env -f .autogenerated/docker-compose.yml up -d
###############################################################################

name: "wanderer"

services:
  db:
    image: "flomp/wanderer-db"
    init: true
    restart: "unless-stopped"
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}"
      MEILI_URL: "http://search:7700"
      ORIGIN: "${ORIGIN:?set ORIGIN in .env}"
      POCKETBASE_ENCRYPTION_KEY: "${POCKETBASE_ENCRYPTION_KEY:?set POCKETBASE_ENCRYPTION_KEY in .env}"
      POCKETBASE_PROXY_SECRET: "${POCKETBASE_PROXY_SECRET:?set POCKETBASE_PROXY_SECRET in .env}"
    volumes:
      - "../data/pb_data:/pb_data"
      - "../data/plugins:/data/plugins"
    ports:
      - "127.0.0.1:8090:8090/tcp"
    depends_on:
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: "15s"
      timeout: "10s"
      start_period: "20s"
      retries: 10
    env_file:
      - path: "../.env"
        required: false

  search:
    image: "getmeili/meilisearch:v1.36.0"
    init: true
    restart: "unless-stopped"
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - "../data/data.ms:/meili_data/data.ms"
    ports:
      - "0.0.0.0:7700:7700/tcp"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl --fail http://localhost:7700/health || exit 1"]
      interval: "15s"
      timeout: "10s"
      start_period: "20s"
      retries: 10

  web:
    image: "flomp/wanderer-web"
    init: true
    restart: "unless-stopped"
    environment:
      BODY_SIZE_LIMIT: "${BODY_SIZE_LIMIT:-2G}"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}"
      MEILI_URL: "http://search:7700"
      ORIGIN: "${ORIGIN:?set ORIGIN in .env}"
      POCKETBASE_ENCRYPTION_KEY: "${POCKETBASE_ENCRYPTION_KEY:?set POCKETBASE_ENCRYPTION_KEY in .env}"
      POCKETBASE_PROXY_SECRET: "${POCKETBASE_PROXY_SECRET:?set POCKETBASE_PROXY_SECRET in .env}"
      PUBLIC_POCKETBASE_URL: "http://db:8090"
      UPLOAD_FOLDER: "/app/uploads"
    volumes:
      - "../data/uploads:/app/uploads"
    ports:
      - "0.0.0.0:3000:3000/tcp"
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/"]
      interval: "15s"
      timeout: "10s"
      start_period: "20s"
      retries: 10
    env_file:
      - path: "../.env"
        required: false
